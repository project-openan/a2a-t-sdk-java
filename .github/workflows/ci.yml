name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Python for template lint
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lint bundled A2A-T templates
        run: python tools/template_lint.py --resource-root a2a-t-resources/src/main/resources/prompt_resources

      - name: Build and run tests
        run: mvn -B clean verify
